<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C10"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#1A1C23"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7700"/>
      <stop offset="100%" stop-color="#FF5E00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="64" fill="url(#bg)" stroke="#2A2E39" stroke-width="8"/>
  
  <!-- Outer Hexagon Frame -->
  <polygon points="256,76 396,157 396,319 256,400 116,319 116,157" fill="none" stroke="#2A2E39" stroke-width="4"/>
  <polygon points="256,96 376,165 376,303 256,372 136,303 136,165" fill="none" stroke="url(#orangeGlow)" stroke-width="6" filter="url(#glow)"/>

  <!-- Center Cyber Monogram IF -->
  <text x="256" y="275" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="120" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">IF</text>
  <text x="256" y="325" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="700" fill="#FF5E00" text-anchor="middle" letter-spacing="8">ICEEFRUIT</text>

  <!-- Corner Crosshairs -->
  <line x1="40" y1="40" x2="70" y2="40" stroke="#FF5E00" stroke-width="3"/>
  <line x1="40" y1="40" x2="40" y2="70" stroke="#FF5E00" stroke-width="3"/>
  <line x1="472" y1="40" x2="442" y2="40" stroke="#FF5E00" stroke-width="3"/>
  <line x1="472" y1="40" x2="472" y2="70" stroke="#FF5E00" stroke-width="3"/>
  <line x1="40" y1="472" x2="70" y2="472" stroke="#FF5E00" stroke-width="3"/>
  <line x1="40" y1="472" x2="40" y2="442" stroke="#FF5E00" stroke-width="3"/>
  <line x1="472" y1="472" x2="442" y2="472" stroke="#FF5E00" stroke-width="3"/>
  <line x1="472" y1="472" x2="472" y2="442" stroke="#FF5E00" stroke-width="3"/>
</svg>
