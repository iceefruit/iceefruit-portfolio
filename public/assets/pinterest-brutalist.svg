<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <pattern id="halftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#2A2E39" fill-opacity="0.6"/>
    </pattern>
    <linearGradient id="slashOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
  </defs>

  <!-- Dark Monochromatic Base -->
  <rect width="1920" height="600" fill="#0B0C10"/>
  <rect width="1920" height="600" fill="url(#halftone)"/>

  <!-- Industrial High-Tech Diagonal Accent Bars -->
  <g opacity="0.85">
    <polygon points="1200,0 1280,0 1140,600 1060,600" fill="#121318"/>
    <polygon points="1300,0 1340,0 1200,600 1160,600" fill="#FF5E00" opacity="0.3"/>
    <polygon points="1350,0 1360,0 1220,600 1210,600" fill="#FF5E00"/>
  </g>

  <!-- Big Raw Typo Frame -->
  <g font-family="'JetBrains Mono', 'Courier New', monospace">
    <text x="100" y="160" font-size="14" fill="#94A3B8" letter-spacing="6">[ INDEX // 001 ]</text>
    <text x="100" y="270" font-size="108" font-weight="900" fill="#F1F5F9" letter-spacing="2">ICEEFRUIT</text>
    
    <rect x="100" y="300" width="380" height="4" fill="url(#slashOrange)"/>

    <text x="100" y="340" font-size="16" font-weight="700" fill="#FF5E00" letter-spacing="4">SYSTEM PROTOCOL // FULL-STACK ARCHITECTURE</text>
    <text x="100" y="375" font-size="12" fill="#94A3B8" letter-spacing="2">NEXT.JS 15 • THREE.JS • WEB AUDIO DSP • PYTHON</text>
    
    <!-- Code Box On Right -->
    <g transform="translate(1380, 180)">
      <rect width="440" height="260" rx="8" fill="#121318" stroke="#2A2E39" stroke-width="1.5"/>
      <rect width="440" height="32" rx="8" fill="#1A1C23"/>
      <circle cx="20" cy="16" r="4" fill="#FF5E00"/>
      <circle cx="36" cy="16" r="4" fill="#3E4451"/>
      <circle cx="52" cy="16" r="4" fill="#3E4451"/>
      <text x="75" y="21" font-size="10" fill="#94A3B8">kernel.log — bash</text>
      
      <text x="24" y="65" font-size="11" fill="#FF5E00">$ status --check</text>
      <text x="24" y="90" font-size="11" fill="#E2E8F0">ALL SYSTEM CORES ACTIVE</text>
      <text x="24" y="115" font-size="11" fill="#94A3B8">DSP: Dual-deck mixing ready</text>
      <text x="24" y="140" font-size="11" fill="#94A3B8">WebGL: 3D hardware active</text>
      <text x="24" y="165" font-size="11" fill="#94A3B8">Vault: 12 Public / 4 Classified</text>
      <text x="24" y="200" font-size="11" fill="#FF5E00">$ _</text>
    </g>
  </g>
</svg>
