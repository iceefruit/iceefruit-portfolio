<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- Deep Space Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040507"/>
      <stop offset="60%" stop-color="#0B0C12"/>
      <stop offset="100%" stop-color="#1A1110"/>
    </linearGradient>

    <!-- Horizon Sun / Glow Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#FF5E00" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FF2A00" stop-opacity="0.30"/>
      <stop offset="85%" stop-color="#0B0C12" stop-opacity="0.0"/>
    </radialGradient>

    <linearGradient id="gridLines" x1="0%" y1="100%" x2="0%" y2="60%">
      <stop offset="0%" stop-color="#FF5E00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2A2E39" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="600" fill="url(#skyGrad)"/>

  <!-- Atmospheric Horizon Sun -->
  <rect width="1920" height="600" fill="url(#sunGlow)"/>

  <!-- Glowing Sun Arc -->
  <circle cx="960" cy="390" r="140" fill="none" stroke="#FF5E00" stroke-width="2" opacity="0.6"/>
  <circle cx="960" cy="390" r="130" fill="#0B0C12" opacity="0.95"/>

  <!-- Sun Blind Lines (Iconic Synthwave/Pinterest aesthetic) -->
  <line x1="840" y1="310" x2="1080" y2="310" stroke="#0B0C12" stroke-width="4"/>
  <line x1="835" y1="330" x2="1085" y2="330" stroke="#0B0C12" stroke-width="6"/>
  <line x1="830" y1="355" x2="1090" y2="355" stroke="#0B0C12" stroke-width="8"/>
  <line x1="830" y1="385" x2="1090" y2="385" stroke="#0B0C12" stroke-width="12"/>

  <!-- Perspective Horizon Grid -->
  <g stroke="url(#gridLines)" stroke-width="1.5">
    <!-- Horizontal lines with perspective foreshortening -->
    <line x1="0" y1="390" x2="1920" y2="390"/>
    <line x1="0" y1="410" x2="1920" y2="410"/>
    <line x1="0" y1="435" x2="1920" y2="435"/>
    <line x1="0" y1="470" x2="1920" y2="470"/>
    <line x1="0" y1="515" x2="1920" y2="515"/>
    <line x1="0" y1="570" x2="1920" y2="570"/>

    <!-- Converging Perspective Lines -->
    <line x1="960" y1="390" x2="-200" y2="600"/>
    <line x1="960" y1="390" x2="150" y2="600"/>
    <line x1="960" y1="390" x2="450" y2="600"/>
    <line x1="960" y1="390" x2="720" y2="600"/>
    <line x1="960" y1="390" x2="960" y2="600" stroke="#FF5E00" stroke-width="2.5"/>
    <line x1="960" y1="390" x2="1200" y2="600"/>
    <line x1="960" y1="390" x2="1470" y2="600"/>
    <line x1="960" y1="390" x2="1770" y2="600"/>
    <line x1="960" y1="390" x2="2120" y2="600"/>
  </g>

  <!-- Typography -->
  <text x="960" y="240" font-family="'JetBrains Mono', monospace" font-size="76" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="14">ICEEFRUIT</text>
  <text x="960" y="275" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#FF5E00" text-anchor="middle" letter-spacing="8">QUANTITATIVE COMPUTING // WEB AUDIO CORE</text>
</svg>
