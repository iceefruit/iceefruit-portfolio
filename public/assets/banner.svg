<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080A"/>
      <stop offset="50%" stop-color="#0B0C10"/>
      <stop offset="100%" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2A2E39" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FF5E00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2A2E39" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#2A2E39" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGrad)"/>
  <rect width="1920" height="600" fill="url(#grid)"/>

  <!-- Perspective Horizon Grid -->
  <g stroke="#2A2E39" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="0" y1="450" x2="1920" y2="450"/>
    <line x1="0" y1="500" x2="1920" y2="500"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="570" x2="1920" y2="570"/>
    <line x1="0" y1="590" x2="1920" y2="590"/>
    
    <!-- Vanishing Lines -->
    <line x1="960" y1="400" x2="-200" y2="600"/>
    <line x1="960" y1="400" x2="200" y2="600"/>
    <line x1="960" y1="400" x2="600" y2="600"/>
    <line x1="960" y1="400" x2="960" y2="600" stroke="#FF5E00" stroke-width="2"/>
    <line x1="960" y1="400" x2="1320" y2="600"/>
    <line x1="960" y1="400" x2="1720" y2="600"/>
    <line x1="960" y1="400" x2="2120" y2="600"/>
  </g>

  <!-- Center Accent Waveform -->
  <path d="M 0,300 Q 480,240 960,300 T 1920,300" fill="none" stroke="url(#accentLine)" stroke-width="4"/>

  <!-- Typography -->
  <text x="960" y="270" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="72" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">ICEEFRUIT</text>
  <text x="960" y="340" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="18" font-weight="600" fill="#FF5E00" text-anchor="middle" letter-spacing="8">HIGH-IMPACT ARCHITECTURE // WEB AUDIO &amp; 3D LAB</text>
</svg>
